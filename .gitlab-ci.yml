stages:
  - test
  - build
  - docker-build
  - deploy

variables:
  # Estas variables deben ser configuradas en GitLab CI/CD
  # DOCKER_USER, DOCKER_PASSWORD, IMAGE_NAME
  # SSH_PRIVATE_KEY, VPS_HOST, VPS_USER, APP_PORT

test:
  stage: test
  image: maven:3.9.6-eclipse-temurin-17
  script:
    - mvn test

build:
  stage: build
  image: maven:3.9.6-eclipse-temurin-17
  script:
    - mvn package -DskipTests
  artifacts:
    paths:
      - target/*.jar

docker-build:
  stage: docker-build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  only:
    - develop
  script:
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USER" --password-stdin
    - docker build -t $IMAGE_NAME:latest -t $IMAGE_NAME:$CI_COMMIT_SHORT_SHA .
    - docker push $IMAGE_NAME:latest
    - docker push $IMAGE_NAME:$CI_COMMIT_SHORT_SHA

deploy:
  stage: deploy
  image: alpine:latest
  only:
    - develop
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $VPS_HOST >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - echo "Iniciando despliegue en servidor $VPS_HOST"
    - ssh $VPS_USER@$VPS_HOST "docker login -u $DOCKER_USER -p $DOCKER_PASSWORD && docker pull $IMAGE_NAME:$CI_COMMIT_SHORT_SHA && docker stop pokemon-api || true && docker rm pokemon-api || true && docker run -d -p $APP_PORT:3001 -e APP_PORT=$APP_PORT -e APP_ENV=production --name pokemon-api $IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
